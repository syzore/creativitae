<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Creativae</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap");

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: white;
        color: black;
        overflow: hidden;
      }

      header {
        text-align: center;
        padding: 50px 20px 30px;
        font-size: 42px;
        font-weight: 300;
      }

      .dashboard {
        padding: 30px;
      }

      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }

      .card {
        width: 180px;
        height: 130px;
        border: 2px solid black;
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: 0.5s;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .words {
        font-size: 20px;
      }

      .count {
        margin-top: 10px;
        color: #888;
        font-size: 13px;
      }

      .plus {
        font-size: 45px;
        font-weight: 200;
      }

      .creation {
        display: none;
      }

      .floating .card {
        position: absolute;
      }

      .creationheader {
        position: absolute;
        left: 50%;
        top: 0%;
        transform: translate(-50%, 0%);
        text-align: center;
      }

      .controls {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      button {
        background: black;
        color: white;
        border: none;
        padding: 14px 25px;
        border-radius: 30px;
        cursor: pointer;
      }

      select,
      input {
        padding: 10px;
        border: 1px solid black;
        border-radius: 20px;
      }

      .idea {
        display: none;
        position: absolute;
        background: white;
        color: black;
        border: none;
        outline: none;
        resize: none;
        left: 20%;
        top: 10%;
        bottom: 10%;
        right: 20%;
        font-size: 16px;
        font-weight: 300;
        line-height: 1.6;
      }

      .bank {
        position: absolute;
        right: 30px;
        bottom: 30px;
        text-decoration: underline;
        cursor: pointer;
      }

      .modal {
        display: none;
        position: absolute;
        inset: 0;
        background: white;
        padding: 40px;
      }
    </style>
  </head>

  <body>
    <div id="dashboard">
      <header>
        Creativae -
        <small>where ideas come to mate</small>
      </header>

      <div class="grid" id="grid">
        <div class="card plus" onclick="startCreation()">+</div>

        <div class="card">
          <div class="words">forest</div>
          <div class="words">robot</div>
          <div class="words">fish</div>
          <div class="count">14 ideas</div>
        </div>

        <div class="card">
          <div class="words">moon</div>
          <div class="words">bakery</div>
          <div class="words">graph</div>
          <div class="count">8 ideas</div>
        </div>

        <div class="card">
          <div class="words">memory</div>
          <div class="words">ocean</div>
          <div class="words">light house</div>
          <div class="count">22 ideas</div>
        </div>
      </div>
    </div>

    <div id="creation" class="creation">
      <div id="floating"></div>

      <h2 class="creationheader" id="generated">Generate your seed</h2>

      <div class="controls">
        <select id="amount">
          <option value="3">3 words</option>
          <option value="4">4 words</option>
          <option value="5">5 words</option>
          <option value="6">6 words</option>
          <option value="random">3-6 random</option>
        </select>

        <br /><br />

        <button onclick="generate()">Generate</button>
      </div>

      <textarea
        id="idea"
        class="idea"
        placeholder="grow your idea here..."
        maxlength="250"
      ></textarea>

      <div class="bank" onclick="openBank()">words bank</div>
    </div>

    <div id="bank" class="modal">
      <h1>Words Bank</h1>

      <p>
        forest ×
        <br />
        robot ×
        <br />
        memory ×
        <br />
        ocean ×
      </p>

      <button onclick="closeBank()">close</button>
    </div>

    <script>
      const words = [
        "forest",
        "robot",
        "memory",
        "ocean",
        "moon",
        "garden",
        "future",
        "coffee",
        "dream",
        "planet",
        "music",
        "child",
        "machine",
        "river",
        "mirror",
        "city",
      ];

      function startCreation() {
        document.getElementById("dashboard").style.display = "none";
        document.getElementById("creation").style.display = "block";

        const floating = document.getElementById("floating");

        floating.innerHTML = "";

        for (let i = 0; i < 6; i++) {
          let c = document.createElement("div");

          c.className = "card";

          c.innerHTML = "seed";

          let side =
            Math.random() > 0.5
              ? Math.random() * 200
              : window.innerWidth - 250 + Math.random() * 100;

          let top = Math.random() * window.innerHeight;

          c.style.left = side + "px";
          c.style.top = top + "px";
          c.style.transform = `rotate(${Math.random() * 80 - 40}deg)`;

          floating.appendChild(c);
        }
      }

      function generate() {
        let amount = document.getElementById("amount").value;

        if (amount === "random") amount = Math.floor(Math.random() * 4) + 3;

        let result = [];

        while (result.length < amount) {
          let w = words[Math.floor(Math.random() * words.length)];

          if (!result.includes(w)) result.push(w);
        }

        document.getElementById("generated").innerHTML = result.join(" · ");

        // hide creation controls
        document.querySelector(".controls").style.display = "none";

        // reveal editor
        const editor = document.getElementById("idea");

        editor.style.display = "block";

        // focus cursor
        setTimeout(() => {
          editor.focus();
        }, 300);
      }

      function openBank() {
        document.getElementById("bank").style.display = "block";
      }

      function closeBank() {
        document.getElementById("bank").style.display = "none";
      }
    </script>
  </body>
</html>
