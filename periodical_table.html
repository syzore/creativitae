<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Periodic Table Memory Game</title>
    <style>
      :root {
        --bg-color: #121212;
        --text-color: #ffffff;
        --cell-bg: #2a2a2a;
        --nonmetal: #4caf50;
        --noble: #9c27b0;
        --alkali: #f44336;
        --alkaline: #ff9800;
        --metalloid: #009688;
        --halogen: #03a9f4;
        --transition: #ffc107;
        --post: #8bc34a;
        --lanthanide: #e91e63;
        --actinide: #9e9e9e;
        --unknown: #607d8b;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        text-align: center;
        margin: 0;
        padding: 20px;
      }

      h1 {
        margin-bottom: 5px;
      }

      .controls {
        margin-bottom: 15px;
      }

      button {
        padding: 10px 20px;
        font-size: 1.1rem;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background: #2196f3;
        color: white;
        font-weight: bold;
        transition: background 0.2s;
      }

      button:hover {
        background: #1976d2;
      }
      button:disabled {
        background: #555;
        cursor: not-allowed;
        color: #888;
      }

      .stats {
        font-size: 1.2rem;
        margin-bottom: 20px;
        display: flex;
        justify-content: center;
        gap: 30px;
      }

      /* Periodic Table Grid */
      .periodic-table {
        display: grid;
        grid-template-columns: repeat(18, 45px);
        grid-template-rows: repeat(10, 50px);
        gap: 4px;
        justify-content: center;
        margin-bottom: 20px;
      }

      .element {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-radius: 4px;
        font-size: 0.9rem;
        font-weight: bold;
        color: #000;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
        transition: transform 0.1s;
        position: relative;
        cursor: pointer;
      }

      .element:hover {
        transform: scale(1.1);
        z-index: 10;
      }

      .element .atomic-number {
        font-size: 0.6rem;
        position: absolute;
        top: 2px;
        left: 3px;
      }

      .hidden-input {
        width: 100%;
        height: 100%;
        border: 2px dashed #888;
        background: #1e1e1e;
        color: #fff;
        text-align: center;
        font-size: 1rem;
        font-weight: bold;
        text-transform: capitalize;
        border-radius: 4px;
        outline: none;
        box-sizing: border-box;
        cursor: text;
      }

      .hidden-input:focus {
        border-color: #fff;
        background: #333;
      }
      .hidden-input.error {
        border-color: #f44336;
        animation: shake 0.3s;
      }

      /* Element Colors */
      .nonmetal {
        background-color: var(--nonmetal);
      }
      .noble {
        background-color: var(--noble);
      }
      .alkali {
        background-color: var(--alkali);
      }
      .alkaline {
        background-color: var(--alkaline);
      }
      .metalloid {
        background-color: var(--metalloid);
      }
      .halogen {
        background-color: var(--halogen);
      }
      .transition {
        background-color: var(--transition);
      }
      .post {
        background-color: var(--post);
      }
      .lanthanide {
        background-color: var(--lanthanide);
      }
      .actinide {
        background-color: var(--actinide);
      }
      .unknown {
        background-color: var(--unknown);
      }

      /* Word Bank */
      .word-bank-container {
        max-width: 800px;
        margin: 0 auto 30px auto;
        padding: 15px;
        background: #1e1e1e;
        border-radius: 8px;
        display: none; /* Hidden during study phase */
      }

      .word-bank-title {
        margin: 0 0 10px 0;
        font-size: 1rem;
        color: #aaa;
      }

      .word-bank {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      .word-bank span {
        padding: 5px 12px;
        background: #333;
        border: 1px solid #555;
        border-radius: 4px;
        font-weight: bold;
        transition: all 0.3s;
      }

      .word-bank span.used {
        opacity: 0.3;
        text-decoration: line-through;
        background: #222;
        border-color: #333;
      }

      /* Modals (Level Up & Element Info) */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        justify-content: center;
        align-items: center;
        z-index: 100;
      }

      .modal-content {
        background: #222;
        padding: 30px;
        border-radius: 10px;
        text-align: center;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        position: relative;
      }

      .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 1.5rem;
        cursor: pointer;
        color: #888;
      }
      .close-btn:hover {
        color: #fff;
      }

      .element-badge {
        width: 80px;
        height: 90px;
        margin: 0 auto 15px auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-radius: 6px;
        color: #000;
        font-weight: bold;
      }
      .element-badge .sym {
        font-size: 2rem;
      }
      .element-badge .num {
        font-size: 0.9rem;
      }

      #level-up-modal h2 {
        font-size: 2.5rem;
        color: #4caf50;
        margin: 0 0 10px 0;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-3px);
        }
        75% {
          transform: translateX(3px);
        }
      }
    </style>
  </head>
  <body>
    <h1>Periodic Table Memory</h1>

    <div class="controls">
      <button id="start-btn" onclick="startGame()">Start Level 1</button>
    </div>

    <div class="stats">
      <div>Level: <strong id="level-display">1</strong></div>
      <div>Missing: <strong id="remaining-display">0</strong></div>
    </div>

    <div class="word-bank-container" id="word-bank-container">
      <h4 class="word-bank-title">Missing Pieces Word Bank:</h4>
      <div class="word-bank" id="word-bank"></div>
    </div>

    <div class="periodic-table" id="table"></div>

    <!-- Level Up Modal -->
    <div class="modal-overlay" id="level-up-modal">
      <div class="modal-content">
        <h2>Level Up!</h2>
        <p>
          Great job! Take a moment to study the board. The next level will hide
          more elements.
        </p>
        <button onclick="prepareNextLevel()">Continue to Next Level</button>
      </div>
    </div>

    <!-- Element Info Modal -->
    <div class="modal-overlay" id="info-modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeInfoModal()">&times;</span>
        <div id="info-badge" class="element-badge">
          <span class="num" id="info-num"></span>
          <span class="sym" id="info-sym"></span>
        </div>
        <h2 id="info-name" style="margin: 0 0 5px 0">Element Name</h2>
        <p
          id="info-cat"
          style="color: #aaa; text-transform: capitalize; margin-top: 0"
        ></p>
      </div>
    </div>

      // Compact dataset: [Atomic Num, Symbol, Column(1-18), Row(1-10), Category]
      const elementsData = [

        [32, "Ge", 14, 4, "metalloid"],
        [33, "As", 15, 4, "metalloid"],
        [34, "Se", 16, 4, "nonmetal"],
        [35, "Br", 17, 4, "halogen"],
        [36, "Kr", 18, 4, "noble"],
        [37, "Rb", 1, 5, "alkali"],

        [100, "Fm", 15, 10, "actinide"],

        [102, "No", 17, 10, "actinide"],

        [106, "Sg", 6, 7, "transition"],
        [107, "Bh", 7, 7, "transition"],
        [108, "Hs", 8, 7, "transition"],
        [109, "Mt", 9, 7, "unknown"],
        [110, "Ds", 10, 7, "unknown"],
        [111, "Rg", 11, 7, "unknown"],
        [112, "Cn", 12, 7, "post"],
        [113, "Nh", 13, 7, "unknown"],
        [114, "Fl", 14, 7, "unknown"],

        [116, "Lv", 16, 7, "unknown"],
        [117, "Ts", 17, 7, "unknown"],
        [118, "Og", 18, 7, "unknown"],
      ];

      let currentLevel = 1;
      let remainingElements = 0;
      let hiddenIndices = new Set();
      let gameState = "study"; // 'study' or 'playing'

      const tableContainer = document.getElementById("table");
      const levelDisplay = document.getElementById("level-display");
      const remainingDisplay = document.getElementById("remaining-display");
      const startBtn = document.getElementById("start-btn");
      const wordBankContainer = document.getElementById("word-bank-container");
      const wordBank = document.getElementById("word-bank");

      const levelUpModal = document.getElementById("level-up-modal");
      const infoModal = document.getElementById("info-modal");

      function initStudyPhase() {
        gameState = "study";
        tableContainer.innerHTML = "";
        levelDisplay.innerText = currentLevel;
        remainingDisplay.innerText = "0";
        wordBankContainer.style.display = "none";

        startBtn.innerText = `Start Level ${currentLevel}`;
        startBtn.disabled = false;

        // Determine what WILL be hidden
        let elementsToHideCount = Math.min(
          3 + (currentLevel - 1) * 3,
          elementsData.length,
        );
        hiddenIndices.clear();
        while (hiddenIndices.size < elementsToHideCount) {
          hiddenIndices.add(Math.floor(Math.random() * elementsData.length));
        }

        // Draw full board for studying
        elementsData.forEach((el, index) => {
          const [num, symbol, col, row, category] = el;
          const cell = document.createElement("div");
          cell.className = `element ${category}`;
          cell.style.gridColumn = col;
          cell.style.gridRow = row;
          cell.innerHTML = `<span class="atomic-number">${num}</span><span class="symbol">${symbol}</span>`;

          // Add click listener for info popup
          cell.addEventListener("click", () =>
            openInfoModal(num, symbol, category),
          );

          tableContainer.appendChild(cell);
        });
      }

      function startGame() {
        gameState = "playing";
        startBtn.disabled = true;
        startBtn.innerText = "Playing...";

        remainingElements = hiddenIndices.size;
        remainingDisplay.innerText = remainingElements;

        wordBankContainer.style.display = "block";
        wordBank.innerHTML = "";
        tableContainer.innerHTML = "";

        let missingSymbols = [];

        // Draw game board
        elementsData.forEach((el, index) => {
          const [num, symbol, col, row, category] = el;
          const isHidden = hiddenIndices.has(index);
          const cell = document.createElement("div");
          cell.style.gridColumn = col;
          cell.style.gridRow = row;

          if (isHidden) {
            missingSymbols.push(symbol);
            const input = document.createElement("input");
            input.type = "text";
            input.maxLength = 2;
            input.className = "hidden-input";
            input.dataset.symbol = symbol;
            input.dataset.category = category;
            input.dataset.num = num;

            input.addEventListener("input", (e) => checkAnswer(e.target, cell));
            cell.appendChild(input);
          } else {
            cell.className = `element ${category}`;
            cell.innerHTML = `<span class="atomic-number">${num}</span><span class="symbol">${symbol}</span>`;
            cell.addEventListener("click", () =>
              openInfoModal(num, symbol, category),
            );
          }
          tableContainer.appendChild(cell);
        });

        // Populate Word Bank (Shuffled)
        missingSymbols
          .sort(() => Math.random() - 0.5)
          .forEach((sym) => {
            const span = document.createElement("span");
            span.innerText = sym;
            span.id = `bank-${sym}`;
            wordBank.appendChild(span);
          });
      }

      function checkAnswer(inputElement, parentCell) {
        const userAnswer = inputElement.value.trim().toLowerCase();
        const correctAnswer = inputElement.dataset.symbol.toLowerCase();

        if (userAnswer === correctAnswer) {
          const num = inputElement.dataset.num;
          const symbol = inputElement.dataset.symbol;
          const category = inputElement.dataset.category;

          // Transform input back to element block
          parentCell.innerHTML = `<span class="atomic-number">${num}</span><span class="symbol">${symbol}</span>`;
          parentCell.className = `element ${category}`;
          parentCell.addEventListener("click", () =>
            openInfoModal(num, symbol, category),
          );

          // Cross off word bank
          const bankItem = document.getElementById(`bank-${symbol}`);
          if (bankItem) bankItem.classList.add("used");

          remainingElements--;
          remainingDisplay.innerText = remainingElements;

          if (remainingElements === 0) {
            setTimeout(() => (levelUpModal.style.display = "flex"), 400);
          }
        } else if (
          userAnswer.length >= correctAnswer.length &&
          userAnswer !== correctAnswer
        ) {
          inputElement.classList.add("error");
          setTimeout(() => inputElement.classList.remove("error"), 300);
        }
      }

      function prepareNextLevel() {
        levelUpModal.style.display = "none";
        currentLevel++;
        initStudyPhase();
      }

      // Element Info Modal Functions
      function openInfoModal(num, symbol, category) {
        const badge = document.getElementById("info-badge");
        document.getElementById("info-num").innerText = num;
        document.getElementById("info-sym").innerText = symbol;
        document.getElementById("info-name").innerText =
          elementNames[num] || "Unknown";
        document.getElementById("info-cat").innerText = category.replace(
          "-",
          " ",
        );

        // Apply category color to badge
        badge.className = `element-badge ${category}`;
        infoModal.style.display = "flex";
      }

      function closeInfoModal() {
        infoModal.style.display = "none";
      }

      // Close modal if clicking outside the card
      window.onclick = function (event) {
        if (event.target === infoModal) closeInfoModal();
      };

      // Initialize first level study phase
      initStudyPhase();
    </script>
  </body>
</html>
